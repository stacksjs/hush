name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  native:
    uses: pantry-pm/pantry/.github/workflows/native-app.yml@v0.11.130
    with:
      release: true
    secrets:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
