name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and release
    # Hush is a macOS app and the build assembles a .app bundle, so this has to
    # run on macOS regardless of how much cheaper a Linux runner would be.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Brings its own Bun, and installs Craft — the native runtime copied into
      # the app bundle — from the pantry registry.
      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main
        with:
          packages: craft

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build app and DMG
        run: bun run package

      # Signing stays optional so a release still completes before the
      # certificates are in place — but an unsigned build is announced loudly
      # rather than shipped quietly, because Gatekeeper will quarantine it.
      - name: Check for signing credentials
        id: signing
        env:
          APPLE_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "${APPLE_APPLICATION_CERTIFICATE:-}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing certificate configured — publishing an unsigned build that Gatekeeper will quarantine."
          fi
          if [ -n "${APPLE_ID:-}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificates
        if: steps.signing.outputs.sign == 'true'
        id: apple
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign the app bundle
        if: steps.signing.outputs.sign == 'true'
        env:
          IDENTITY: ${{ steps.apple.outputs.apple-signing-identity }}
        run: |
          set -euo pipefail
          # The Craft runtime inside the bundle is a separate Mach-O and has to
          # be signed first, or the outer signature seals an unsigned
          # executable and verification fails.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" dist/Hush.app/Contents/MacOS/craft
          codesign --force --options runtime --timestamp \
            --entitlements build/entitlements.plist \
            --sign "$IDENTITY" dist/Hush.app
          codesign --verify --deep --strict --verbose=2 dist/Hush.app

      - name: Rebuild the DMG around the signed app
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -euo pipefail
          rm -f dist/*.dmg
          hdiutil create -volname Hush -srcfolder dist/Hush.app -ov -format UDZO \
            "dist/Hush-${{ steps.version.outputs.version }}.dmg"

      - name: Notarize
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="dist/Hush-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # A DMG supports stapling, so the ticket travels with the download and
          # Gatekeeper does not have to be online to verify it.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish the GitHub release
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          release: 'true'
          release-files: dist/*.dmg
          # Notes come from the commits between the previous tag and this one,
          # so the release reads correctly without CHANGELOG.md having to be
          # regenerated and committed first.
          release-changelog: auto
          release-checksums: 'true'
          release-token: ${{ secrets.GITHUB_TOKEN }}
