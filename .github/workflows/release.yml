name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and release
    # Hush is a macOS app and the build assembles a .app bundle, so this has to
    # run on macOS regardless of how much cheaper a Linux runner would be.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Brings its own Bun, and installs Craft — the native runtime copied into
      # the app bundle — from the pantry registry.
      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Craft runtime
        run: scripts/setup-craft.sh

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build app and DMG
        run: bun run package

      # Signing stays optional so a release still completes before the
      # certificates are in place — but an unsigned build is announced loudly
      # rather than shipped quietly, because Gatekeeper will quarantine it.
      - name: Check for signing credentials
        id: signing
        env:
          APPLE_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "${APPLE_APPLICATION_CERTIFICATE:-}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing certificate configured — publishing an unsigned build that Gatekeeper will quarantine."
          fi
          if [ -n "${APPLE_ID:-}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificates
        if: steps.signing.outputs.sign == 'true'
        id: apple
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign the app bundle
        if: steps.signing.outputs.sign == 'true'
        env:
          IDENTITY: ${{ steps.apple.outputs.apple-signing-identity }}
        run: |
          set -euo pipefail
          # One Mach-O in the bundle — Craft is CFBundleExecutable itself — so
          # a single signature covers everything.
          codesign --force --options runtime --timestamp \
            --entitlements build/entitlements.plist \
            --sign "$IDENTITY" dist/Hush.app
          codesign --verify --deep --strict --verbose=2 dist/Hush.app

      - name: Rebuild the DMG around the signed app
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -euo pipefail
          rm -f dist/*.dmg
          hdiutil create -volname Hush -srcfolder dist/Hush.app -ov -format UDZO \
            "dist/Hush-${{ steps.version.outputs.version }}.dmg"

      - name: Notarize
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="dist/Hush-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # A DMG supports stapling, so the ticket travels with the download and
          # Gatekeeper does not have to be online to verify it.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # ── Mac App Store ───────────────────────────────────────────────────
      # Runs only when the store credentials are configured. A direct-download
      # release stays useful on its own, so a missing App Store setup must not
      # fail the whole release.
      - name: Check for App Store credentials
        id: appstore
        env:
          INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -n "${INSTALLER_CERT:-}" ] && [ -n "${API_KEY_ID:-}" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store credentials not configured — publishing the direct download only."
          fi

      - name: Import App Store signing certificates
        if: steps.appstore.outputs.submit == 'true'
        id: appstore-signing
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          apple-signing-installer-certificate: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-provisioning-profile: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Build the App Store package
        if: steps.appstore.outputs.submit == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.appstore-signing.outputs.apple-signing-identity }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ steps.appstore-signing.outputs.apple-signing-installer-identity }}
          APPLE_PROVISIONING_PROFILE_PATH: ${{ steps.appstore-signing.outputs.apple-signing-provisioning-profile }}
        run: |
          # Rebuild first: the direct-download signing above applied the
          # hardened-runtime entitlements, and the store needs the sandboxed
          # set on an otherwise identical bundle.
          bun run build
          scripts/package-appstore.sh

      - name: Upload to App Store Connect
        if: steps.appstore.outputs.submit == 'true'
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          release-app-store: 'true'
          release-app-store-package: dist/Hush-${{ steps.version.outputs.version }}.pkg
          release-app-store-bundle-id: org.stacksjs.hush
          release-app-store-version: ${{ steps.version.outputs.version }}
          release-app-store-build-number: ${{ github.run_number }}
          release-app-store-api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          release-app-store-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          release-app-store-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # Re-running a release must not fail on a build number App Store
          # Connect already has.
          release-app-store-retry-existing: 'true'

      - name: Publish the GitHub release
        uses: home-lang/pantry/packages/action@main
        with:
          install: 'false'
          release: 'true'
          release-files: dist/*.dmg
          # Notes come from the commits between the previous tag and this one,
          # so the release reads correctly without CHANGELOG.md having to be
          # regenerated and committed first.
          release-changelog: auto
          release-checksums: 'true'
          release-token: ${{ secrets.GITHUB_TOKEN }}
