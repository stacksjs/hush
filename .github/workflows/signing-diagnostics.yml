name: Native signing diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: home-lang/pantry/packages/action@main
      - name: Check the native profile tools
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/Hush.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          PROFILE_PATH="$profile" bun -e '
            console.log("Bun", Bun.version);
            const decoded = Bun.spawnSync(["/usr/bin/security", "cms", "-D", "-i", process.env.PROFILE_PATH]);
            console.log(JSON.stringify({ stage: "decode", exit: decoded.exitCode, bytes: decoded.stdout.length, stderr: decoded.stderr.toString() }));
            if (decoded.exitCode !== 0) process.exit(1);
            for (const args of [["-"], ["--", "-"]]) {
              const result = Bun.spawnSync(["/usr/bin/plutil", "-extract", "Entitlements", "json", "-o", "-", ...args], { stdin: decoded.stdout });
              console.log(JSON.stringify({ stage: "extract", args, exit: result.exitCode, bytes: result.stdout.length, stderr: result.stderr.toString(), diagnostic: result.exitCode ? result.stdout.toString() : undefined }));
            }
            const xml = process.env.RUNNER_TEMP + "/Hush-decoded.plist";
            await Bun.write(xml, decoded.stdout);
            const file = Bun.spawnSync(["/usr/bin/plutil", "-extract", "Entitlements", "json", "-o", "-", xml]);
            console.log(JSON.stringify({ stage: "file", exit: file.exitCode, bytes: file.stdout.length, stderr: file.stderr.toString(), diagnostic: file.exitCode ? file.stdout.toString() : undefined }));
            const dictionary = Bun.spawnSync(["/usr/bin/plutil", "-extract", "Entitlements", "xml1", "-o", "-", "-"], { stdin: decoded.stdout });
            const json = Bun.spawnSync(["/usr/bin/plutil", "-convert", "json", "-o", "-", "-"], { stdin: dictionary.stdout });
            console.log(JSON.stringify({ stage: "dictionary", extractExit: dictionary.exitCode, convertExit: json.exitCode, bytes: json.stdout.length, stderr: dictionary.stderr.toString() + json.stderr.toString(), diagnostic: json.exitCode ? json.stdout.toString() : undefined }));
            if (dictionary.exitCode !== 0 || json.exitCode !== 0) process.exit(1);
          '
