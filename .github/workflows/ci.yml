name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, typecheck, test
    # The core is platform-free, so the fast checks do not need a Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  build:
    name: Build the app bundle
    # Proves the release path on every push: the same script the release
    # workflow runs, producing the same bundle. A packaging break that only
    # shows up at tag time is the expensive kind.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main
        with:
          packages: craft

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app and DMG
        run: bun run package

      - name: Verify the bundle is complete
        run: |
          set -euo pipefail
          APP=dist/Hush.app
          test -x "$APP/Contents/MacOS/Hush"
          test -x "$APP/Contents/MacOS/craft"
          test -f "$APP/Contents/Resources/index.html"
          test -f "$APP/Contents/Info.plist"

          # The usage description is what makes Focus status readable at all;
          # a bundle missing it fails silently at runtime.
          plutil -extract NSFocusStatusUsageDescription raw "$APP/Contents/Info.plist" > /dev/null

          # Menubar-only. Without this the app takes a dock slot.
          test "$(plutil -extract LSUIElement raw "$APP/Contents/Info.plist")" = "true"

          # The launcher must reference the bundled runtime, never a path from
          # the build machine.
          grep -q '"\$DIR/craft"' "$APP/Contents/MacOS/Hush"
          ! grep -q '/Users/' "$APP/Contents/MacOS/Hush"

          ls dist/*.dmg >/dev/null

      - name: Verify the app launches
        run: |
          set -euo pipefail
          # Craft's benchmark mode creates the window, reports ready and exits,
          # which proves the runtime accepts the compiled document.
          dist/Hush.app/Contents/MacOS/craft \
            --html-file dist/Hush.app/Contents/Resources/index.html \
            --benchmark --quiet | grep -q ready
