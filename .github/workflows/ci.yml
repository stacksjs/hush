name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, typecheck, test
    # The core is platform-free, so the fast checks do not need a Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  build:
    name: Build the app bundle
    # Proves the release path on every push: the same script the release
    # workflow runs, producing the same bundle. A packaging break that only
    # shows up at tag time is the expensive kind.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Set up pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the pinned Craft version
        id: craft
        run: echo "version=$(bun --print '(await import(\"./craft.config.ts\")).config.craftVersion')" >> "$GITHUB_OUTPUT"

      - name: Cache the Craft runtime
        uses: actions/cache@v5
        with:
          path: .craft
          key: craft-${{ runner.os }}-${{ runner.arch }}-${{ steps.craft.outputs.version }}

      - name: Build the Craft runtime
        run: scripts/setup-craft.sh

      - name: Build app and DMG
        run: bun run package

      - name: Verify the bundle is complete
        run: |
          set -euo pipefail
          APP=dist/Hush.app
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/index.html"
          test -f "$APP/Contents/Resources/craft.json"

          # CFBundleExecutable must be a Mach-O image. A shell launcher works
          # for a direct download but is rejected by the Mac App Store, so the
          # shape is asserted rather than assumed.
          file -b "$APP/Contents/MacOS/Hush" | grep -q 'Mach-O'
          test ! -e "$APP/Contents/MacOS/craft"

          # The usage description is what makes Focus status readable at all;
          # a bundle missing it fails silently at runtime.
          plutil -extract NSFocusStatusUsageDescription raw "$APP/Contents/Info.plist" > /dev/null

          # Menubar-only. Without this the app takes a dock slot.
          test "$(plutil -extract LSUIElement raw "$APP/Contents/Info.plist")" = "true"

          # Nothing in the bundle may reference a path from the build machine.
          ! grep -rq '/Users/runner' "$APP/Contents/Resources/craft.json"

          ls dist/*.dmg >/dev/null

      - name: End-to-end against the built bundle
        # Drives the compiled document and the real client bundle in a DOM
        # against a mocked bridge. This is what catches the template and the
        # bundle drifting apart — a failure mode that leaves the unit suite
        # green and every control in the app inert.
        run: bun test test/e2e.test.ts --preload ./test-utils/dom.ts

      - name: Verify the app launches
        run: |
          set -euo pipefail
          # Benchmark mode creates the window, reports ready and exits. Run the
          # bundle executable with no arguments, which is exactly how
          # LaunchServices starts it — so this also proves the manifest is
          # being read.
          # Both streams, and captured rather than piped. Craft reports through
          # its log facility, which is stderr, and `grep -q` would close the
          # pipe on its first match — the app takes SIGPIPE and `pipefail`
          # turns a successful run into a failed step.
          output="$(dist/Hush.app/Contents/MacOS/Hush --benchmark 2>&1)"
          grep -q ready <<< "$output"
